server.port=8000
spring.datasource.url=jdbc:sqlite:techjobs.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
# External job provider (default: Remotive, free, no key). Swap by env vars.
job.api.url=${JOB_API_URL:https://remotive.com/api/remote-jobs?category=software-dev&limit=40}
job.api.key=${JOB_API_KEY:}
cors.origins=http://localhost:3000,http://127.0.0.1:3000
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
